name: Build & Push to main
on:
  push:
    branches: [ source ]

permissions:
  contents: write   # 允许往 main 写

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.145.0'
          extended: true
      - run: hugo --minify
      - name: Deploy to main
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          # 如果 main 受保护，可能需要关闭强制孤儿分支或放宽保护：
          # force_orphan: false

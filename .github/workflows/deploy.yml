name: Deploy Hugo Site

on:
  push:
    branches: [source]
  workflow_dispatch:

concurrency:
  group: deploy-hugo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true
      - name: Check theme behavior
        run: node --test tests/performance.test.cjs
      - name: Build site
        run: hugo --cleanDestinationDir
      - name: Validate generated site and Markdown integration
        run: python3 tests/check-build.py public
      - name: Deploy to GitHub Pages (main branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          cname: yihaow.com

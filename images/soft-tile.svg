<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" fill="none">
<defs>
 <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85b9d1" stop-opacity=".21"/><stop offset="1" stop-color="#9bafd6" stop-opacity=".1"/></linearGradient>
 <linearGradient id="lunar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#abb0d4" stop-opacity=".19"/><stop offset="1" stop-color="#94abc9" stop-opacity=".1"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82bdbd" stop-opacity=".2"/><stop offset="1" stop-color="#94bfce" stop-opacity=".1"/></linearGradient>
 <radialGradient id="starlight"><stop stop-color="#83bfff" stop-opacity=".5"/><stop offset=".3" stop-color="#9dcfff" stop-opacity=".24"/><stop offset="1" stop-color="#b7dbff" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet-light"><stop stop-color="#b2a2ed" stop-opacity=".42"/><stop offset=".3" stop-color="#c0b7ef" stop-opacity=".2"/><stop offset="1" stop-color="#d3c9f5" stop-opacity="0"/></radialGradient>
 <clipPath id="gas"><circle r="29"/></clipPath>
 <mask id="ring-gap" maskUnits="userSpaceOnUse" x="-62" y="-33" width="124" height="66"><path d="M-62-33H62V33H-62Z" fill="#fff"/><circle r="31" fill="#000"/></mask>
</defs>
<!-- Ringed ice planet: the far ring sits behind the body. -->
<g transform="translate(118 112) rotate(-24)" stroke="#82a9c5" stroke-opacity=".34" stroke-width="1">
 <ellipse rx="60" ry="17" mask="url(#ring-gap)"/>
 <ellipse rx="54" ry="12" stroke-opacity=".15" mask="url(#ring-gap)"/>
 <circle r="31" fill="url(#ice)" stroke-opacity=".27"/>
 <path d="M-60 0a60 17 0 0 0 120 0"/>
 <path d="M-54 1a54 12 0 0 0 108 0" stroke-opacity=".19"/>
 <path d="M-17-19c8-8 21-8 30-2" stroke="#fff" stroke-opacity=".5"/>
</g>
<!-- Cratered moon and a small companion in a broken orbit. -->
<g transform="translate(524 166)" stroke="#9a9fc5" stroke-width="1">
 <ellipse rx="64" ry="49" transform="rotate(25)" stroke-opacity=".21" stroke-dasharray="72 12 3 12"/>
 <circle r="35" fill="url(#lunar)" stroke-opacity=".3"/>
 <g fill="#a7afce" fill-opacity=".09" stroke-opacity=".25">
  <circle cx="-12" cy="-10" r="9"/><circle cx="13" cy="11" r="7"/>
  <circle cx="-9" cy="18" r="4"/><circle cx="17" cy="-17" r="3"/>
 </g>
 <path d="M-20-9a9 9 0 0 1 12-9M7 11a7 7 0 0 1 9-6" stroke-opacity=".25"/>
 <circle cx="52" cy="35" r="6" fill="#c7dce6" fill-opacity=".55" stroke="#8aacc4" stroke-opacity=".4"/>
</g>
<!-- Banded gas planet; a tiny satellite marks its elliptical orbit. -->
<g transform="translate(308 420) rotate(16)">
 <ellipse rx="65" ry="42" stroke="#8cb2bd" stroke-opacity=".22" stroke-width=".8" stroke-dasharray="107 16 3 16"/>
 <circle r="29" fill="url(#sea)" stroke="#87b1bc" stroke-opacity=".3"/>
 <g clip-path="url(#gas)" stroke="#83afb9" stroke-opacity=".24" stroke-width="2">
  <path d="M-33-13q18 7 34 1t33 3M-34-2q17 8 35 2t34 2M-33 11q16 6 31 2t34 0"/>
 </g>
 <circle cx="-57" cy="20" r="4.5" fill="#b4cedd" fill-opacity=".45" stroke="#8bafc1" stroke-opacity=".36"/>
</g>
<!-- A small irregular asteroid, rather than another blurred circle. -->
<g transform="translate(650 476) rotate(-18)" stroke="#a5a4bd" stroke-opacity=".3" stroke-width=".8">
 <path d="m-16-3 5-13 14-3 12 8 3 13-10 12-14 1-10-8Z" fill="#b2b1cc" fill-opacity=".12"/>
 <path d="m-8-7 5-3 5 3-1 6-6 1Zm13 11 5-3 3 4-3 4Z"/>
</g>
<!-- Sparse constellation fragments, stars and instrument marks. -->
<g stroke="#8ba9c0" stroke-opacity=".23" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round">
 <path d="m268 68 24-16 30 9 16 28M62 352l21-20 28 10M449 540l28-11 20 12"/>
 <path d="m414 300 25-16 28 13 23-24M604 323l24-23 29 11 24-20" stroke-opacity=".2"/>
 <path d="M385 240v10m-5-5h10M661 66v8m-4-4h8M170 516v8m-4-4h8"/>
 <path d="m414 358 3 5 3-5-3-5ZM198 273l2.5 4 2.5-4-2.5-4Z"/>
 <path d="M59 453v12m-6-6h12M597 323h14m-7-3v6" stroke-opacity=".16"/>
</g>
<g fill="#8aa9c2" fill-opacity=".3">
 <circle cx="268" cy="68" r="1.5"/><circle cx="292" cy="52" r="2"/><circle cx="322" cy="61" r="1.5"/><circle cx="338" cy="89" r="1.2"/>
 <circle cx="62" cy="352" r="1.3"/><circle cx="83" cy="332" r="1.8"/><circle cx="111" cy="342" r="1.2"/>
 <circle cx="449" cy="540" r="1.2"/><circle cx="477" cy="529" r="1.8"/><circle cx="497" cy="541" r="1.2"/>
 <circle cx="414" cy="300" r="1.2"/><circle cx="439" cy="284" r="1.7"/><circle cx="467" cy="297" r="1.3"/><circle cx="490" cy="273" r="1.1"/>
 <circle cx="604" cy="323" r="1.2"/><circle cx="628" cy="300" r="1.8"/><circle cx="657" cy="311" r="1.3"/><circle cx="681" cy="291" r="1.1"/>
 <circle cx="49" cy="210" r="1"/><circle cx="396" cy="118" r="1"/><circle cx="690" cy="269" r="1"/><circle cx="197" cy="579" r="1"/>
</g>
<!-- Just two small luminous stars per tile; gradient halos need no blur filter. -->
<g transform="translate(292 52)">
 <circle r="12" fill="url(#starlight)"/>
 <path d="M0-6 1.1-1.1 6 0 1.1 1.1 0 6-1.1 1.1-6 0-1.1-1.1Z" fill="#a4c8e5" fill-opacity=".55"/>
 <circle r="1.2" fill="#fff" fill-opacity=".9"/>
</g>
<g transform="translate(628 300)">
 <circle r="10" fill="url(#violet-light)"/>
 <path d="M0-4.5.9-.9 4.5 0 .9.9 0 4.5-.9.9-4.5 0-.9-.9Z" fill="#b2aed7" fill-opacity=".5"/>
 <circle r="1" fill="#fff" fill-opacity=".85"/>
</g>
</svg>

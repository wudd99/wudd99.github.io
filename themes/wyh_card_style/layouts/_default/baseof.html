<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode | default "en" }}">
<head>{{ partial "base/head.html" . }}</head>
<body data-page="{{ if .IsHome }}home{{ else if eq .Kind "section" }}blog-list{{ else }}blog-post{{ end }}">
{{ partial "base/page-start.html" . }}
<div class="container">
{{ partial "base/sidebar.html" . }}
<main class="main-content" id="main-content">
{{ if .IsHome }}<h1 class="visually-hidden">{{ .Site.Title }}</h1>{{ end }}
<div class="content-area">{{ block "main" . }}{{ end }}</div>
{{ partial "base/footer.html" . }}
</main>
{{ partial "base/right-rail.html" . }}
</div>
{{ partial "base/scripts.html" . }}
</body>
</html>
